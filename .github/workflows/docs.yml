# The Kairos documentation book — KAIROS-T-0167 (KAIROS-I-0016), laid out as
# the four Diátaxis modes per KAIROS-S-0008. Since KAIROS-T-0389 the book is an
# Astro Starlight site with the Colliery theme starlight-aurora, and this file
# follows the Pages workflow of its starter.
#
# Builds the site in docs/ on each pull request that changes it, and publishes
# it to the GitHub Pages of this repository on a push to main. Triggered by
# changes to docs/** ONLY, which is deliberate: documentation ships
# independently of release tags, so a typo fix does not wait for a version
# bump and a release does not wait for prose. The release workflow
# (release.yml) is untouched by this.
#
# One-time setup: Settings → Pages → Source = "GitHub Actions".

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One build per ref; a newer push supersedes an in-flight one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build the book
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Install
        run: npm ci --no-audit --no-fund

      # The Pages base path (/kairos) comes from configure-pages. A pull
      # request builds at /, which is enough to prove the book builds.
      - name: Build
        run: npm run build
        env:
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Upload the built site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: publish to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
