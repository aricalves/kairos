<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Kairos</title>
    <!--
      KAIROS-T-0605: the IBM Plex fonts of Aurora come from this host. The
      preconnect opens the connection before the stylesheet asks for a font.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Aurora THEME_INIT_SCRIPT (COLLIERY-T-1836; the 0.6 script, which
      accepts "hyper", KAIROS-T-0397), copied as it is. It sets
      data-theme on <html> from the stored choice before the first paint, so
      the page does not show the wrong theme while the WASM loads. It must
      stay before the stylesheet. A unit test (src/app.rs) compares it with
      the constant of the Aurora crate.
    -->
    <script>(function(){try{var t=localStorage.getItem("aurora-theme");if(t==="light"||t==="dark"||t==="hyper"){var d=document.documentElement;d.setAttribute("data-theme",t);if(t!=="hyper")d.style.colorScheme=t;}}catch(e){}})();</script>
    <!--
      KAIROS-T-0326, KAIROS-T-0605: one linked stylesheet, written by the
      pre_build hook of Trunk.toml (crates/kairos-web-css): the Aurora
      stylesheet, then app.css (the Kairos-only rules, tokens only). The
      page so has it at the first paint.
    -->
    <link data-trunk rel="css" href="style/kairos.css" />
    <!--
      KAIROS-T-0397, KAIROS-T-0605: the opt-in hyper theme of Aurora. The
      hook writes it with a hash in its name (assets are immutable), and
      trunk copies it with no link. This script loads it after the
      stylesheet, as Aurora asks, only for data-theme "hyper":
      - At page load with a stored "hyper" (THEME_INIT_SCRIPT), it writes
        the link into the page. The parser makes that link, so it blocks
        the first paint and the WASM, and the toggle shows Hyper.
      - When the ThemeToggle sets "hyper" later, it adds the link.
      A unit test (crates/kairos-web-css) checks the name of the file.
    -->
    <link data-trunk rel="copy-file" href="style/hyper-166e269f8b1f9ce6.css" />
    <script>
      (function () {
        var H = "/hyper-166e269f8b1f9ce6.css";
        var ID = "kairos-hyper-css";
        var root = document.documentElement;
        function hyper() { return root.getAttribute("data-theme") === "hyper"; }
        if (hyper()) {
          document.write('<link id="' + ID + '" rel="stylesheet" href="' + H + '" />');
        }
        new MutationObserver(function () {
          if (!hyper() || document.getElementById(ID)) return;
          var link = document.createElement("link");
          link.id = ID;
          link.rel = "stylesheet";
          link.href = H;
          document.head.appendChild(link);
        }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
      })();
    </script>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <!--
      KAIROS-T-0324: mermaid fences. The markdown renderer writes each
      fence as <pre class="kairos-mermaid"> with the escaped source. This
      script watches the page, loads the vendored Mermaid only when such a
      block appears (vendor/mermaid/README.md has its version and
      checksum), and draws each block with securityLevel "strict", in the
      light or dark theme (hyper has a dark base, so it takes the dark
      theme of Mermaid). A block that does not parse keeps its source and
      shows the error.
    -->
    <link data-trunk rel="copy-file" href="vendor/mermaid/mermaid-12.1.0.min.js" />
    <script>
      (function () {
        var SRC = "/mermaid-12.1.0.min.js";
        var loading = null;
        var count = 0;
        var queued = false;
        function load() {
          if (!loading) {
            loading = new Promise(function (resolve, reject) {
              var s = document.createElement("script");
              s.src = SRC;
              s.onload = function () { resolve(window.mermaid); };
              s.onerror = function () { loading = null; reject(new Error("Kairos could not load " + SRC + ".")); };
              document.head.appendChild(s);
            });
          }
          return loading;
        }
        function dark() {
          var t = document.documentElement.getAttribute("data-theme");
          if (t === "dark" || t === "hyper" || t === "light") return t !== "light";
          return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
        function fail(el, error) {
          el.classList.add("kairos-mermaid--error");
          var note = document.createElement("div");
          note.className = "kairos-mermaid__error";
          note.textContent = "The diagram has an error: " + ((error && error.message) || String(error));
          el.parentNode && el.parentNode.insertBefore(note, el);
        }
        function draw() {
          queued = false;
          var nodes = Array.prototype.slice.call(
            document.querySelectorAll("pre.kairos-mermaid:not([data-kairos-drawn])"));
          if (!nodes.length) return;
          nodes.forEach(function (el) { el.setAttribute("data-kairos-drawn", "1"); });
          load().then(function (mermaid) {
            mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: dark() ? "dark" : "default" });
            nodes.forEach(function (el) {
              var id = "kairos-mermaid-" + (++count);
              mermaid.render(id, el.textContent).then(function (result) {
                if (!el.isConnected) return;
                var div = document.createElement("div");
                div.className = "kairos-mermaid-diagram";
                div.innerHTML = result.svg;
                el.replaceWith(div);
              }, function (error) {
                var stray = document.getElementById("d" + id);
                if (stray) stray.remove();
                if (el.isConnected) fail(el, error);
              });
            });
          }, function (error) {
            nodes.forEach(function (el) { fail(el, error); });
          });
        }
        function schedule() {
          if (queued) return;
          queued = true;
          window.requestAnimationFrame(draw);
        }
        new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener("DOMContentLoaded", schedule);
      })();
    </script>
  </head>
  <body></body>
</html>
